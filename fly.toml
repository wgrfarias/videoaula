# Gerado manualmente para este projeto — ajuste `app` e `primary_region`
# antes do primeiro deploy. Veja o passo a passo no README (seção Fly.io).

app = "troque-pelo-nome-do-seu-app"
primary_region = "gru" # São Paulo

[build]

[deploy]
  # Roda as migrations do Prisma numa máquina temporária antes de trocar o
  # tráfego para a nova versão — nunca serve a nova versão sem o schema
  # atualizado no banco.
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Volume para uploads locais (avatar, capa enviada, vídeo de destaque da
# home) que não vão para o Bunny.net. Como o volume só existe numa máquina
# física, mantenha min_machines_running = 1 e não escale para mais de uma
# máquina sem antes mover esses uploads para um storage externo (o próprio
# Bunny Storage, S3, R2 etc.).
[[mounts]]
  source = "videoaula_uploads"
  destination = "/app/public/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
